<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
</head>
<body style="margin:0; padding:24px; background-color:#f7f8f3; color:#555; font-family:'Space Mono','JetBrains Mono','Segoe UI',Tahoma,Verdana,monospace;">
    <div style="max-width:600px; margin:0 auto; background-color:#fcfcfc; border-radius:24px; overflow:hidden; border:1px solid #eef0ea; box-shadow:0 8px 24px rgba(0,0,0,0.06), 0 0 0 1px rgba(0,0,0,0.03);">
        <div style="background-color:#f2f2ee; padding:20px 24px; text-align:center; border-bottom:1px solid #e6e8e0;">
            <h2 style="margin:0; font-size:20px; font-weight:600; letter-spacing:0.2px; color:#333;">Confirm Your Email</h2>
        </div>

        <div style="padding:28px 30px; color:#555;">
            <p style="margin:0 0 12px 0;">Hi <strong style="color:#333;">{{Username}}</strong>,</p>
            <p style="margin:0 0 18px 0;">Thanks for joining us! Please click the button below to verify your email address and activate your account.</p>

            <div style="text-align:center; margin:26px 0;">
                <a href="{{CallbackUrl}}" style="display:inline-block; padding:12px 24px; border-radius:14px; text-decoration:none; color:#333; background-color:#f5f5f2; border:1px solid #d5d7cf; box-shadow:inset 0 0 4px rgba(0,0,0,0.04); font-weight:600;">
                    Verify Email
                </a>
            </div>

            <p style="margin:0 0 14px 0; font-size:13px; color:#666;">If you didn't create an account, you can safely ignore this email.</p>

            <hr style="border:none; border-top:1px solid #e2e4dc; margin:18px 0;" />

            <p style="margin:0; font-size:11px; color:#aaa; line-height:1.4; text-align: center;">
                Trouble with the button? <a href="{{CallbackUrl}}" style="color:#888; text-decoration:underline;">Click here</a> to verify manually.
            </p>
        </div>
    </div>
</body>
</html>
